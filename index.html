<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andon Vey &middot; Author of the Khalzam Trilogy</title>
  <meta name="description" content="Andon Vey, author of the Khalzam Trilogy. Andon Vey, auteur van de Khalzam-trilogie.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/mirrorstone.svg">
  <meta name="theme-color" content="#0e1013">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="nl" href="/nl/">
  <link rel="alternate" hreflang="x-default" href="/en/">
  <script>
    (function () {
      var lang;
      try { lang = localStorage.getItem('andonvey-lang'); } catch (e) {}
      if (!lang) {
        lang = (navigator.language || navigator.userLanguage || 'en').substring(0, 2).toLowerCase();
      }
      var href = (lang === 'nl') ? '/nl/' : '/en/';
      if (window.location.pathname !== href) {
        window.location.replace(href);
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div style="min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 24px;">
    <div>
      <p class="eyebrow" style="margin-bottom:18px;">Andon Vey</p>
      <p style="color:var(--text-muted); margin-bottom:22px;">The Khalzam Trilogy &middot; De Khalzam-trilogie</p>
      <p><a class="btn btn--primary" href="/en/">English</a><span style="color:var(--text-muted); margin:0 12px;">|</span><a class="btn btn--ghost" href="/nl/">Nederlands</a></p>
    </div>
  </div>
</body>
</html>
