<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andon Vey</title>
  <meta name="description" content="Andon Vey, author of the Khalzam Trilogy. Andon Vey, auteur van de Khalzam-trilogie.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/mirrorstone.svg">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="nl" href="/nl/">
  <link rel="alternate" hreflang="x-default" href="/en/">
  <script>
    (function () {
      var lang;
      try { lang = localStorage.getItem('andonvey-lang'); } catch (e) {}
      if (!lang) {
        lang = (navigator.language || navigator.userLanguage || 'en').substring(0, 2).toLowerCase();
      }
      var href = (lang === 'nl') ? '/nl/' : '/en/';
      if (window.location.pathname !== href) {
        window.location.replace(href);
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
    .start { color: var(--sand-dim); font-size: 1.1rem; }
    .start a { color: var(--copper-light); }
    .start .sep { color: var(--sand-muted); margin: 0 0.6rem; }
  </style>
</head>
<body>
  <div class="start">
    <p>Andon Vey &middot; <a href="/en/">English</a><span class="sep">|</span><a href="/nl/">Nederlands</a></p>
  </div>
</body>
</html>
